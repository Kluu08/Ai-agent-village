  }else if(kind==="rock"){
    x.strokeStyle="rgba(43,51,55,.21)";x.lineWidth=2;
    for(let i=0;i<26;i++){let px=rand()*128,py=rand()*128;x.beginPath();x.moveTo(px,py);x.lineTo(px+rand()*26-13,py+rand()*17);x.stroke()}
  }

}

const base=box(root,3.25,.24,2.85,M("#9a9684"),0,.10,0);

house("hq",0,-8,"#60e6e7","AI HQ",1.28);house("sales",8,-5.7,"#50dadd","Sales");house("support",9,3.5,"#f1b960","Support");house("research",-8,-5.3,"#ad85ed","Research");house("marketing",-8,4.6,"#b3e571","Marketing");
const needleA=M("#37694e"),needleB=M("#49865d"),leafA=M("#54865b"),leafB=M("#679762"),leafC=M("#5d985e"),pebbleMat=M("#8d9890");
function tree(x,z,s=1,type=0){const t=new THREE.Group();t.position.set(x,1.9,z);t.scale.setScalar(s);world.add(t);cyl(t,.12,.17,.83,wood,0,.42,0,7);if(type===0){for(let i=0;i<3;i++)mesh(new THREE.ConeGeometry(.71-i*.12,1.13,7),i===0?needleA:needleB,t,0,1.13+i*.39,0)}else{ball(t,.70,leafA,0,1.38,0);ball(t,.50,leafB,.4,1.43,.1);ball(t,.5,leafC,-.32,1.65,0)}}

const agents=[];function robot(x,z,color,orbit=2){const g=new THREE.Group();world.add(g);const white=M("#e5e8e3"),black=M("#101b25"),accent=M(color);ball(g,.27,white,0,.60,0);ball(g,.46,white,0,1.27,0);ball(g,.36,black,0,1.27,.36);for(let sx of [-1,1]){ball(g,.085,accent,sx*.16,1.32,.69);ball(g,.13,black,sx*.46,1.24,0);ball(g,.18,white,sx*.28,.48,0);ball(g,.10,white,sx*.37,.75,.09);ball(g,.10,white,sx*.12,.20,.07)}

let yaw=.65,pitch=.73,dist=36,target=new THREE.Vector3(0,1,0),focus=null,follow=false;
const overview=()=>{focus=null;follow=false;target.set(0,1,0);yaw=.65;pitch=.73;dist=window.innerWidth<700?45:36;document.querySelector("#cameraLabel").textContent="Overview"};

const descriptions={hq:["AI Headquarters","Central command hub and coordinator for the village."],sales:["Sales Department","Leads, follow-ups, and customer conversions."],support:["Support Department","Customer questions, tickets, and resolutions."],research:["Research Department","Knowledge gathering, insights, and analysis."],marketing:["Marketing Department","Campaigns, design requests, and creative work."]};

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let lastDown=null,pointers=new Map();
